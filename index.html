<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Quiz Game</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-card">
    <section id="quiz-screen">
      <h1>Quick Quiz</h1>
      <p class="subtitle">Choose the correct answer.</p>

      <div class="quiz-top">
        <span id="question-count"></span>
        <span id="score-display">Score: 0</span>
      </div>

      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" aria-live="polite"></p>

      <button id="next-button" class="main-button hidden">
        Next Question
      </button>
    </section>

    <section id="result-screen" class="result-screen hidden">
      <h2>Quiz completed!</h2>
      <p>Your final score is:</p>
      <p id="final-score"></p>
      <button id="restart-button" class="main-button">Play Again</button>
    </section>
  </main>
</body>
</html>
